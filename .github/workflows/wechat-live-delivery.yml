name: WeChat Pay production delivery checks
on:
  push:
    branches: [main]
    paths:
      - 'backend/src/wechatLive*.mjs'
      - 'backend/scripts/preflight.mjs'
      - 'backend/scripts/migration-source-inventory.mjs'
      - 'backend/tests/migrationSourceInventory.test.mjs'
      - 'scripts/phone-preview-profile.mjs'
      - 'backend/tests/phone-preview-payment-config.test.mjs'
      - 'backend/scripts/migrate-dev.mjs'
      - 'backend/docs/DELIVERY_CANDIDATE_2026-11-08.md'
      - 'backend/src/wechatAbnormalReview.mjs'
      - 'backend/src/wechatBillReconciliation.mjs'
      - 'backend/src/paymentSettlementTransaction.mjs'
      - 'backend/src/wechatPayV3.mjs'
      - 'backend/src/billing.mjs'
      - 'backend/sql/036_wechat_refund_reconcile.sql'
      - 'backend/sql/037_wechat_abnormal_collection_reviews.sql'
      - 'backend/tests/wechatLive*.test.mjs'
      - 'backend/sql/001_init.sql'
      - 'backend/sql/035_wechat_live_refunds.sql'
      - 'backend/tests/wechatAbnormalReview.test.mjs'
      - 'backend/tests/wechatBillReconciliation.test.mjs'
      - 'backend/tests/paymentSettlementTransaction.test.mjs'
      - 'miniprogram/modules/shared/api/wechatLiveReceipt.ts'
      - 'miniprogram/pages/order-detail/**'
      - 'miniprogram/pages/admin-orders/**'
      - 'miniprogram/pages/admin-billing/**'
      - '.github/workflows/wechat-live-delivery.yml'
  pull_request:
    paths:
      - 'backend/src/wechatLive*.mjs'
      - 'backend/scripts/preflight.mjs'
      - 'backend/scripts/migration-source-inventory.mjs'
      - 'backend/tests/migrationSourceInventory.test.mjs'
      - 'scripts/phone-preview-profile.mjs'
      - 'backend/tests/phone-preview-payment-config.test.mjs'
      - 'backend/scripts/migrate-dev.mjs'
      - 'backend/docs/DELIVERY_CANDIDATE_2026-11-08.md'
      - 'backend/src/wechatAbnormalReview.mjs'
      - 'backend/src/wechatBillReconciliation.mjs'
      - 'backend/src/paymentSettlementTransaction.mjs'
      - 'backend/src/billing.mjs'
      - 'backend/tests/wechatLive*.test.mjs'
      - 'backend/sql/001_init.sql'
      - 'backend/sql/035_wechat_live_refunds.sql'
      - 'backend/tests/wechatAbnormalReview.test.mjs'
      - 'backend/tests/wechatBillReconciliation.test.mjs'
      - 'backend/tests/paymentSettlementTransaction.test.mjs'
      - 'miniprogram/pages/admin-billing/**'
      - '.github/workflows/wechat-live-delivery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-receipts-refunds-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Verify payment and refund modules
        run: |
          node --check backend/src/wechatLiveReceipt.mjs
          node --check backend/src/wechatLiveRefundReconcile.mjs
          node --check backend/src/wechatLiveRefundRoute.mjs
          node --check backend/src/wechatLivePaymentRoute.mjs
          node --check backend/src/paymentSettlementTransaction.mjs
          node --check backend/src/server.mjs
          node --check backend/src/billing.mjs
          node --check backend/src/wechatAbnormalReview.mjs
          node --check backend/src/wechatBillReconciliation.mjs
          node --test backend/tests/wechatLiveDelivery.test.mjs backend/tests/wechatLivePayment.test.mjs backend/tests/wechatLiveRefund.test.mjs backend/tests/paymentSettlementTransaction.test.mjs backend/tests/wechatAbnormalReview.test.mjs backend/tests/wechatBillReconciliation.test.mjs
      - name: Verify migration sequence, syntax and configuration warnings (read-only)
        run: npm run preflight --prefix backend
      - name: Run full backend offline regression suite
        run: npm test --prefix backend
      - name: Verify migration source audit guardrails (no DB connection)
        run: node --test backend/tests/migrationSourceInventory.test.mjs
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend types
        run: npx tsc --noEmit
      - name: Verify all three frontend build targets and offline UX contracts
        run: npm run verify:frontend
      - name: Verify phone preview profile and payment feature isolation
        run: node --test backend/tests/phone-preview-payment-config.test.mjs
