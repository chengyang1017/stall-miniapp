name: WeChat Pay production delivery checks
on:
  push:
    branches: [main]
    paths:
      - 'backend/src/wechatLive*.mjs'
      - 'backend/src/wechatPayV3.mjs'
      - 'backend/src/billing.mjs'
      - 'backend/sql/036_wechat_refund_reconcile.sql'
      - 'backend/tests/wechatLive*.test.mjs'
      - 'miniprogram/modules/shared/api/wechatLiveReceipt.ts'
      - 'miniprogram/pages/order-detail/**'
      - 'miniprogram/pages/admin-orders/**'
      - 'miniprogram/pages/admin-billing/**'
      - '.github/workflows/wechat-live-delivery.yml'
  pull_request:
    paths:
      - 'backend/src/wechatLive*.mjs'
      - 'backend/tests/wechatLive*.test.mjs'
      - '.github/workflows/wechat-live-delivery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-receipts-refunds-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Verify payment and refund modules
        run: |
          node --check backend/src/wechatLiveReceipt.mjs
          node --check backend/src/wechatLiveRefundReconcile.mjs
          node --check backend/src/wechatLiveRefundRoute.mjs
          node --check backend/src/wechatLivePaymentRoute.mjs
          node --check backend/src/server.mjs
          node --check backend/src/billing.mjs
          node --test backend/tests/wechatLiveDelivery.test.mjs backend/tests/wechatLivePayment.test.mjs backend/tests/wechatLiveRefund.test.mjs
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend types
        run: npx tsc --noEmit
      - name: Build mini program
        run: npm run build:combined
