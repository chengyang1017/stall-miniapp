name: Phone onboarding and identity checks
on:
  push:
    branches: [main]
    paths:
      - 'miniprogram/pages/profile/**'
      - 'miniprogram/pages/addresses/**'
      - 'miniprogram/pages/orders/**'
      - 'miniprogram/pages/order-detail/**'
      - 'backend/src/customer*'
      - 'backend/tests/customer*'
      - 'backend/tests/wechat-phone-bind.test.mjs'
      - '.github/workflows/phone-onboarding.yml'
      - 'backend/scripts/check-phone-binding-readiness.mjs'
      - 'backend/migrations/proposals/025_customer_phone_rotation_audit.sql'
      - 'backend/migrations/proposals/wechat-verified-phone-binding.sql'
      - 'backend/sql/024_customer_cloud_profile.sql'
      - 'backend/sql/025_customer_avatar_style.sql'
      - 'backend/tests/identity-postgres.integration.test.mjs'
      - 'backend/sql/023_customer_identity_groundwork.sql'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Phone identity and onboarding tests
        run: node --test backend/tests/wechat-phone-bind.test.mjs backend/tests/customer-account-snapshot.test.mjs backend/tests/customer-account-orders-read.test.mjs backend/tests/customer-account-address-write.test.mjs backend/tests/customer-account-address-read.test.mjs backend/tests/customer-account-sessions.test.mjs backend/tests/customer-identity-link.test.mjs backend/tests/customer-phone-identity.test.mjs backend/tests/customer-phone-account-lookup.test.mjs backend/tests/customer-wechat-phone-login.test.mjs backend/tests/customer-session-route.test.mjs backend/tests/customer-phone-rotation.test.mjs backend/tests/customer-phone-recovery-policy.test.mjs backend/tests/customer-session-boundary.test.mjs backend/tests/customer-wechat-identity-link-route.test.mjs backend/tests/frontend-phone-onboarding-source.test.mjs
      - name: Validate read-only staging preflight syntax
        run: node --check backend/scripts/check-phone-binding-readiness.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build combined app (CI environment)
        run: npm run build:combined

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: identity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d identity_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated backend dependencies
        run: npm ci --prefix backend
      - name: Run real PostgreSQL identity and phone-binding transactions
        env:
          IDENTITY_CI_DB_HOST: 127.0.0.1
          IDENTITY_CI_DB_NAME: identity_ci
          IDENTITY_CI_DB_USER: postgres
          IDENTITY_CI_DB_PASSWORD: ci_only_password
        run: node --test backend/tests/identity-postgres.integration.test.mjs
