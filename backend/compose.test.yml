# Source-only B0 infrastructure. Starting this configuration WRITES a new database.
# Only scripts/start-test-db.mjs is a controlled launch entry; direct Compose is not.
# Supply four different 64-hex passwords in files OUTSIDE the repository.
name: stall-phase8-b0
services:
  phase8-postgres:
    image: ${STALL_PHASE8_IMAGE:?Reviewed immutable image reference required}
    pull_policy: never
    container_name: stall-phase8-pg16
    restart: "no"
    entrypoint: ["sh", "/phase8/bootstrap-entrypoint.sh"]
    environment:
      POSTGRES_USER: stall_test_bootstrap
      POSTGRES_DB: stall_test_phase8
      POSTGRES_PASSWORD_FILE: /run/secrets/phase8_admin_password
      PGDATA: /var/lib/postgresql/data
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      STALL_PHASE8_INSTANCE_ID: ${STALL_PHASE8_INSTANCE_ID:?Explicit new instance UUID required}
      STALL_PHASE8_BOOTSTRAP_CONFIRM: ${STALL_PHASE8_BOOTSTRAP_CONFIRM:?Explicit bootstrap authorization required}
      STALL_PHASE8_LAUNCH_TOKEN: ${STALL_PHASE8_LAUNCH_TOKEN:?Controlled launcher token required}
      STALL_PHASE8_IMAGE: ${STALL_PHASE8_IMAGE:?Reviewed immutable image reference required}
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_error_statement=panic", "-c", "log_parameter_max_length_on_error=0", "-c", "listen_addresses=*", "-c", "port=5432"]
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - phase8-data:/var/lib/postgresql/data
      - ./testing/phase8/bootstrap.sh:/docker-entrypoint-initdb.d/10-phase8-bootstrap.sh:ro
      - ./testing/phase8/bootstrap-entrypoint.sh:/phase8/bootstrap-entrypoint.sh:ro
      - ${STALL_PHASE8_LAUNCH_RECEIPT:?Controlled launcher receipt required}:/run/phase8-launch:ro
    secrets:
      - phase8_admin_password
      - phase8_migrator_password
      - phase8_app_password
      - phase8_observer_password
    networks: [phase8-network]
    labels:
      stall.phase8.scope: isolated-integration
      stall.phase8.instance: ${STALL_PHASE8_INSTANCE_ID:?Explicit instance UUID required}
      stall.phase8.launch: ${STALL_PHASE8_LAUNCH_TOKEN:?Controlled launcher token required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stall_test_bootstrap -d stall_test_phase8"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  phase8-data:
    name: stall-phase8-data
    labels:
      stall.phase8.scope: isolated-integration
      stall.phase8.instance: ${STALL_PHASE8_INSTANCE_ID:?Explicit instance UUID required}
      stall.phase8.launch: ${STALL_PHASE8_LAUNCH_TOKEN:?Controlled launcher token required}
networks:
  phase8-network:
    name: stall-phase8-network
    internal: true
    labels:
      stall.phase8.scope: isolated-integration
      stall.phase8.instance: ${STALL_PHASE8_INSTANCE_ID:?Explicit instance UUID required}
      stall.phase8.launch: ${STALL_PHASE8_LAUNCH_TOKEN:?Controlled launcher token required}
secrets:
  phase8_admin_password:
    file: ${STALL_PHASE8_ADMIN_PASSWORD_FILE:?External admin password file required}
  phase8_migrator_password:
    file: ${STALL_PHASE8_MIGRATOR_PASSWORD_FILE:?External migrator password file required}
  phase8_app_password:
    file: ${STALL_PHASE8_APP_PASSWORD_FILE:?External app password file required}
  phase8_observer_password:
    file: ${STALL_PHASE8_OBSERVER_PASSWORD_FILE:?External observer password file required}
